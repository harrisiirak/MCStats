name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish ZStats/ZStats.csproj -p:PublishProfile=Linux-x64 -o out
      - run: mv out/ZStats ZStats-linux-x64
      - run: gh release create "$GITHUB_REF_NAME" ZStats-linux-x64 --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
